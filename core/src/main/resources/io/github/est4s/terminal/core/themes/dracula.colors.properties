# Terminal colours: the Dracula theme.
#
# One colour per line as key=#rrggbb. Keys: background, foreground,
# cursor, and color0 to color255 (0-7 normal, 8-15 bright, 16-255 the
# xterm 256-colour palette). Lines starting with # are comments.
# Keys you leave out keep the Neon colour. `pocket check` applies edits.
background=#282a36
foreground=#f8f8f2
cursor=#f8f8f2

color0=#21222c
color8=#6272a4
color1=#ff5555
color9=#ff6e6e
color2=#50fa7b
color10=#69ff94
color3=#f1fa8c
color11=#ffffa5
color4=#bd93f9
color12=#d6acff
color5=#ff79c6
color13=#ff92df
color6=#8be9fd
color14=#a4ffff
color7=#f8f8f2
color15=#ffffff
