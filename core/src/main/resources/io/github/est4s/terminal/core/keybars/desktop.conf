# Key bar for the desktop (mynx set view desktop, or Ctrl+Shift+D).
# One button per line: label = keys, as in the shell's bar
# (`mynx keybar show shell` explains the format). Here the keys go to
# the X server, so Super works too: Super on its own is sticky, like
# Ctrl and Alt, and Super+Up is a chord. A sticky modifier also holds
# for the next click.
# To change it: `mynx keybar edit desktop`.

Esc   = Esc
Tab   = Tab
Ctrl  = Ctrl
Alt   = Alt
Super = Super
←     = Left
↓     = Down
↑     = Up
→     = Right
