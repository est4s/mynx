# Terminal colours: the Phosphor (green monochrome CRT) theme.
#
# One colour per line as key=#rrggbb. Keys: background, foreground,
# cursor, and color0 to color255 (0-7 normal, 8-15 bright, 16-255 the
# xterm 256-colour palette). Lines starting with # are comments.
# Keys you leave out keep the Neon colour. `pc26 check` applies edits.
background=#001100
foreground=#33ff66
cursor=#66ff99

color0=#002a0d
color8=#1f5a2e
color1=#1f9e3d
color9=#4dbb66
color2=#33ff66
color10=#80ff9f
color3=#99ff66
color11=#ccff99
color4=#1f7a3d
color12=#4d9966
color5=#2ecc71
color13=#66e699
color6=#66ffaa
color14=#99ffcc
color7=#b3ffcc
color15=#e6ffee
