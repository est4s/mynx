# Key bar for Neon Flap (flap).
# One button per line: label = keys. Buttons fill two rows, the first
# half on top; more than fit go on pages you swipe to. Keys run in order:
#   key names: Enter Esc Tab Space Backspace Delete Insert Up Down Left
#     Right Home End PgUp PgDn F1-F12 (any case)
#   a single character: l  /  =
#   with modifiers: Ctrl+R  Alt+Left  Shift+Tab  Ctrl+Alt+Delete
#   "text in quotes" is typed as is
#   Ctrl on its own is sticky: it applies to the next key you type
#   Repeat: sends again and again while held (arrows, PgUp/PgDn,
#     Backspace and Delete do this on their own)
# To change a bar: `mynx edit keybars`, or `mynx keybar edit NAME`
# and edit the copy it makes in ~/.config/mynx/keybars/.

Flap = Space
Quit = q
