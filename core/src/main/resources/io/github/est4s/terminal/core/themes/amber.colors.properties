# Terminal colours: the Amber (monochrome CRT) theme.
#
# One colour per line as key=#rrggbb. Keys: background, foreground,
# cursor, and color0 to color255 (0-7 normal, 8-15 bright, 16-255 the
# xterm 256-colour palette). Lines starting with # are comments.
# Keys you leave out keep the Neon colour. `pocket check` applies edits.
background=#1c1200
foreground=#ffb000
cursor=#ffcc00

color0=#2e1f00
color8=#6b4a00
color1=#cc7a00
color9=#ff9933
color2=#e69500
color10=#ffb84d
color3=#ffb000
color11=#ffd280
color4=#b37400
color12=#d9a050
color5=#d98a00
color13=#ffad5c
color6=#f2a200
color14=#ffc966
color7=#ffc040
color15=#ffe0a0
