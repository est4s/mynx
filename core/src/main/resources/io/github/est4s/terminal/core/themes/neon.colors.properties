# Terminal colours: the Neon theme.
#
# One colour per line as key=#rrggbb. Keys: background, foreground,
# cursor, and color0 to color255 (0-7 normal, 8-15 bright, 16-255 the
# xterm 256-colour palette). Lines starting with # are comments.
# Keys you leave out keep the Neon colour. `pc26 check` applies edits.
background=#14101f
foreground=#e4eef4
cursor=#ff7edb

color0=#241b35
color8=#4a3d66
color1=#fe4450
color9=#ff6b75
color2=#72f1b8
color10=#9cf5cc
color3=#fede5d
color11=#ffe98a
color4=#6c9cff
color12=#9ab9ff
color5=#b967ff
color13=#d19bff
color6=#03edf9
color14=#6af4fb
color7=#c8c2d8
color15=#ffffff
