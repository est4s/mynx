# The launcher menu's items, in order: one "Label = action" per line.
# To change the menu, copy this file to ~/.config/pocket-terminal/menu.conf
# (`pocket menu edit` does) and edit the copy, or use `pocket edit menu`.
#
# Actions: shell     leave the menu for the shell
#          files     the file manager
#          games     the Games menu
#          settings  the settings editors (pocket edit)
#          system    Update all, System info
#          exit      close the tab
#          run CMD   run any command, e.g. "Top = run htop"
# Labels: up to 20 characters.
Terminal = shell
Files    = files
Games    = games
Settings = settings
System   = system
Exit     = exit
