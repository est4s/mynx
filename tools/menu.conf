# The launcher menu's items, in order: one "Label = action" per line.
# To change the menu, copy this file to ~/.config/mynx/menu.conf
# (`mynx menu edit` does) and edit the copy, or use `mynx edit menu`.
#
# Actions: shell     leave the menu for the shell
#          files     the file manager
#          apps      the Apps menu: example apps, and yours in ~/apps
#          games     the Games menu
#          settings  the Settings menu: App settings, System, Help
#          app-settings  the settings editors (mynx edit)
#          agents    AI agents: start one, or install it
#          system    Update all, System info, GitHub setup
#          help      Getting started, Report a bug, About
#          welcome   the welcome page (Getting started)
#          exit      close the tab
#          run CMD   run any command, e.g. "Top = run htop"
# Labels: up to 20 characters.
Shell           = shell
AI agents       = agents
Apps            = apps
Games           = games
Files           = files
Settings        = settings
Exit            = exit
