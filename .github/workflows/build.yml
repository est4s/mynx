name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: TDD check (code changes come with test changes)
        if: github.event_name != 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = 0000000000000000000000000000000000000000 ]; then
            range="${{ github.sha }}~1..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          failed=0
          for c in $(git rev-list --no-merges "$range"); do
            if git log -1 --format=%B "$c" | grep -q '^TDD: refactor$'; then continue; fi
            if ! git diff-tree --no-commit-id --name-only -r "$c" | scripts/check-tdd.sh; then
              echo "  in commit $(git log -1 --format='%h %s' "$c")"
              failed=1
            fi
          done
          exit $failed

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew --no-daemon test

      # proot is built from source with the NDK and cached; the binaries are
      # never committed. The cache key changes with the script (which pins the
      # versions) and the runner's NDK.
      - name: NDK version
        id: ndk
        run: |
          echo "home=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_OUTPUT"
          echo "version=$(grep Pkg.Revision "$ANDROID_NDK_LATEST_HOME/source.properties" | cut -d' ' -f3)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: proot-cache
        with:
          path: build/proot
          key: proot-${{ hashFiles('scripts/build-proot.sh') }}-ndk-${{ steps.ndk.outputs.version }}

      - name: Build proot
        if: steps.proot-cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.home }}
        run: scripts/build-proot.sh build/proot

      - name: Add proot to the APK
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp build/proot/*.so app/src/main/jniLibs/arm64-v8a/

      - name: Build Debian rootfs
        run: scripts/build-rootfs.sh app/src/main/assets

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: pocket-terminal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          # The APK is mostly the xz rootfs; zipping it again gains nothing.
          compression-level: 0

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-reports
          path: "**/build/reports/tests/"
